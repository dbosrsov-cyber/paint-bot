name: geo-announce-once
"on":
  workflow_dispatch:
    inputs:
      bot_token:
        description: Telegram bot token (one-off)
        required: true
        type: string
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send announce and weekly stats
        env:
          BOT_TOKEN: ${{ inputs.bot_token }}
        run: python3 scripts/announce_weekly_stats.py
