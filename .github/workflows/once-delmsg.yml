name: once-delmsg
on:
  push:
    paths:
      - .github/workflows/once-delmsg.yml
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - name: call delmsg
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w "%%{http_code}" --max-time 30 "https://paint-bot.onrender.com/delmsg?key=sumai-tginfo-2026&chat=-1002304715333&mid=1210759&cb=$(date +%%s)" || echo CURLFAIL)
          echo "HTTP $code"
          cat /tmp/resp.txt
